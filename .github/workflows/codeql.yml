name: CodeQL

# Code scanning for GitHub Actions workflows and this repo's Python scripts
# (scripts/quantize-flux-4bit.py). Swift is deliberately NOT analyzed here —
# ManifoldKit/ManifoldKit's codeql.yml found CodeQL's Swift tracer wraps every
# swiftc invocation and pushed build times past a 30-minute timeout on that
# codebase; the same tracer overhead applies here. If CodeQL Swift support
# improves, this workflow can grow a swift leg — see core's codeql.yml history.
#
# This workflow runs cheap on ubuntu-latest for both legs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly baseline scan, Mondays 06:00 UTC. Keeps the Security tab fresh
    # even on quiet weeks.
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required to upload SARIF results to the Security tab
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
